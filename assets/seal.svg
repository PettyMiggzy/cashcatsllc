<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" fill="none" role="img" aria-label="CashCats LLC seal">
  <defs>
    <path id="arcTop" d="M 36 100 A 64 64 0 0 1 164 100"/>
    <path id="arcBot" d="M 34 100 A 66 66 0 0 0 166 100"/>
  </defs>
  <g stroke="#1a7f4b" fill="none">
    <circle cx="100" cy="100" r="94" stroke-width="2.5"/>
    <circle cx="100" cy="100" r="86" stroke-width="1"/>
    <circle cx="100" cy="100" r="52" stroke-width="1" stroke-dasharray="1 4"/>
  </g>
  <g fill="#1a7f4b" font-family="'Times New Roman',Georgia,serif" font-weight="700" letter-spacing="2.5">
    <text font-size="13"><textPath href="#arcTop" startOffset="50%" text-anchor="middle">CASHCATS · LLC</textPath></text>
    <text font-size="10.5" letter-spacing="2"><textPath href="#arcBot" startOffset="50%" text-anchor="middle">ROBINHOOD CHAIN</textPath></text>
  </g>
  <g fill="#1a7f4b" stroke="none">
    <circle cx="60" cy="100" r="1.6"/><circle cx="140" cy="100" r="1.6"/>
  </g>
  <!-- cat sitting on a bundle of cash -->
  <g transform="translate(100 104)">
