    <g stroke="#a9812a" fill="none" stroke-width="1.6">
      <rect x="-30" y="18" width="60" height="20" rx="2"/>
      <rect x="-27" y="14" width="54" height="20" rx="2"/>
      <line x1="-6" y1="14" x2="-6" y2="34"/><line x1="6" y1="14" x2="6" y2="34"/>
      <text x="0" y="30" font-family="'Times New Roman',serif" font-weight="700" font-size="13" fill="#a9812a" stroke="none" text-anchor="middle">$</text>
    </g>
    <!-- cat -->
    <g stroke="#1a7f4b" fill="none" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M -18 12 L -18 -6 L -11 -18 L -5 -8 L 5 -8 L 11 -18 L 18 -6 L 18 12 Z"/>
      <path d="M 18 12 C 26 6 26 -4 20 -6"/>
      <circle cx="-7" cy="-1" r="1.4" fill="#1a7f4b"/>
      <circle cx="7" cy="-1" r="1.4" fill="#1a7f4b"/>
      <path d="M -2 4 L 0 6 L 2 4"/>
      <path d="M -1 6 L -1 9 M 1 6 L 1 9"/>
      <path d="M -17 -6 L -8 -3 M -17 0 L -8 -1 M 17 -6 L 8 -3 M 17 0 L 8 -1"/>
